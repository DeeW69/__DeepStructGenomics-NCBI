[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepstructgenomics-ncbi"
version = "0.4.6"
description = "Pipeline ARN/genomique reliant sequence -> structure -> impact a partir des donnees NCBI."
authors = [
  {name = "DeeW69"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "numpy>=1.24",
  "biopython>=1.83",
  "vtk>=9.2",
  "matplotlib>=3.7"
]
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
research = ["ViennaRNA==2.7.2", "scipy==1.15.3; python_version < '3.11'", "scipy==1.17.1; python_version >= '3.11'"]

[project.urls]
homepage = "https://github.com/DeeW69/__DeepStructGenomics-NCBI"

[tool.setuptools.packages.find]
include = ["deepstructgenomics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
