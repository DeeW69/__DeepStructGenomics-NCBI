name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-lock.txt"
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run tests without a graphical viewer
        run: python -m pytest
      - name: Install optional research methods
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-research-lock.txt"
      - name: Check research dependency compatibility
        run: python -m pip check
      - name: Run tests with research methods
        run: python -m pytest
      - name: Install optional desktop interface
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-gui-lock.txt"
      - name: Install Qt system library on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Check desktop dependency compatibility
        run: python -m pip check
      - name: Test desktop workflows offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_gui.py tests/test_gui_services.py
